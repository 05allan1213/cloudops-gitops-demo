apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/component: workload
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/component: workload
        cloudops.io/monitoring: enabled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: ghcr.io/05allan1213/cloudops-demo@sha256:a7c5afa70140460e3a6bf56f3df2367df23446563e16e15a541c710cf66990ae
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          env:
            - name: REQUIRED_ENV
              value: baseline-present
            - name: SERVICE_VERSION
              value: 07a6a619e6f0b2c00828fcd03bfa8e7196f1c391
            - name: SOURCE_REVISION
              value: 07a6a619e6f0b2c00828fcd03bfa8e7196f1c391
            - name: DEPLOYMENT_ENVIRONMENT
              value: local-demo
            - name: K8S_CLUSTER_NAME
              value: cloudops-v3-final
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: TRACE_OTLP_ENDPOINT
              value: cloudops-otel-collector.cloudops-system.svc.cluster.local:4317
            - name: TRACE_SAMPLE_RATE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
